appId: com.hortemo.expoPhotosE2E
---
- launchApp:
    clearState: true
- tapOn:
    id: "run-tests"
- assertVisible:
    id: "test-progress-request-permission"
- assertVisible:
    id: "test-progress-authorization-status-before"
- assertVisible:
    id: "test-progress-authorization-status-after"
- assertVisible:
    id: "test-progress-fetch-images"
- assertVisible:
    id: "test-progress-image-count"
- assertVisible:
    id: "test-progress-export-image"
- assertVisible:
    id: "test-progress-image-exported"
- assertVisible:
    id: "test-progress-fetch-videos"
- assertVisible:
    id: "test-progress-video-count"
- assertVisible:
    id: "test-progress-export-video"
- assertVisible:
    id: "test-progress-video-exported"
- assertVisible:
    id: "test-status"
    text: "Status: success"

# Test pickAssets - tap button, select a photo, tap Add, verify result
- scrollUntilVisible:
    element:
      id: "run-pick-assets"
    direction: DOWN
- tapOn:
    id: "run-pick-assets"
- tapOn:
    text: "Photo, .*"
    index: 0
- assertVisible:
    id: "pick-assets-result"
    text: "Picked 1 asset(s)"
